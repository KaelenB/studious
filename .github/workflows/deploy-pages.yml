name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository variable (Settings > Secrets and variables > Actions > Variables).
      STUDIOUS_API_URL: ${{ vars.STUDIOUS_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate API URL
        run: |
          case "$STUDIOUS_API_URL" in
            https://*|http://127.0.0.1*|http://localhost*) ;;
            *) echo "::error::Set repository variable STUDIOUS_API_URL to the backend HTTPS URL (or a loopback URL)."; exit 1 ;;
          esac
      - name: Resolve base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run test --workspace frontend
      - run: npm run build --workspace frontend
        env:
          VITE_API_BASE_URL: ${{ vars.STUDIOUS_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
