services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # The central SQLite database lives on the named volume; the API is its only writer.
      DATABASE_PATH: /app/backend/data/studious.sqlite
      DATABASE_MAX_BYTES: ${DATABASE_MAX_BYTES:-1073741824}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - sqlite-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  sqlite-data:
